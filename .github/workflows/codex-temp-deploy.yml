name: Codex temporary website deployment

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Source branch or commit
        required: true
        default: feature/indice-brand-system

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0

      - name: Prepare deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Build exact deployment manifest
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD \
            | grep -E '\.(php|css|js|json|svg|png|xml)$|^\.htaccess$' \
            | grep -Ev '^(AGENTS\.md|README\.md|\.env|\.git|\.vscode|data/|logs/)' \
            | sort -u > "$RUNNER_TEMP/deploy-manifest.txt"
          grep -qxF '.htaccess' "$RUNNER_TEMP/deploy-manifest.txt" || printf '%s\n' '.htaccess' >> "$RUNNER_TEMP/deploy-manifest.txt"
          test -s "$RUNNER_TEMP/deploy-manifest.txt"
          while IFS= read -r file; do test -f "$file"; done < "$RUNNER_TEMP/deploy-manifest.txt"

      - name: Back up and upload website
        env:
          FTP_HOST: ${{ secrets.CODEX_DEPLOY_FTP_HOST_20260727 }}
          FTP_USER: ${{ secrets.CODEX_DEPLOY_FTP_USER_20260727 }}
          FTP_PASSWORD: ${{ secrets.CODEX_DEPLOY_FTP_PASSWORD_20260727 }}
          FTP_PORT: ${{ secrets.CODEX_DEPLOY_FTP_PORT_20260727 }}
          FTP_REMOTE_PATH: ${{ secrets.CODEX_DEPLOY_FTP_PATH_20260727 }}
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/website-backup"
          command_file="$RUNNER_TEMP/deploy.lftp"
          mkdir -p "$backup_dir"
          while IFS= read -r file; do mkdir -p "$backup_dir/$(dirname "$file")"; done < "$RUNNER_TEMP/deploy-manifest.txt"
          {
            printf '%s\n' \
              'set cmd:fail-exit yes' \
              'set net:max-retries 4' \
              'set net:timeout 25' \
              'set ssl:verify-certificate yes' \
              'set ssl:check-hostname no' \
              'set ftp:ssl-protect-data yes' \
              'set xfer:clobber yes' \
              "open -u $FTP_USER,$FTP_PASSWORD -p $FTP_PORT $FTP_HOST" \
              "cd $FTP_REMOTE_PATH" \
              'set cmd:fail-exit no'
            while IFS= read -r file; do printf 'get %s -o %s/%s\n' "$file" "$backup_dir" "$file"; done < "$RUNNER_TEMP/deploy-manifest.txt"
            printf '%s\n' 'set cmd:fail-exit yes'
            while IFS= read -r file; do printf 'put %s -o %s\n' "$file" "$file"; done < "$RUNNER_TEMP/deploy-manifest.txt"
            printf '%s\n' 'bye'
          } > "$command_file"
          lftp -f "$command_file"
          rm -f "$command_file"

      - name: Verify public deployment
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsS "https://indiceapp.com/?deploy=$stamp" | grep -Fq 'class="home-minimal"'
          curl -fsS "https://indiceapp.com/planes.php?deploy=$stamp" | grep -Fq 'plans.config.growth.storage'
          curl -fsS "https://indiceapp.com/css/style.css?deploy=$stamp" | grep -Fq '.pricing-growth-note'
          curl -fsS "https://indiceapp.com/js/planes.js?deploy=$stamp" | grep -Fq 'CONSULTING_PRICE = 89'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://indiceapp.com/.env?deploy=$stamp")" = '403'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://indiceapp.com/data/?deploy=$stamp")" = '403'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://indiceapp.com/logs/?deploy=$stamp")" = '403'

      - name: Preserve pre-deployment copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indice-web-pre-deployment-backup
          path: ${{ runner.temp }}/website-backup
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
