name: Deploy flag assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload flag assets
        env:
          FTP_HOST: ${{ secrets.INDICE_TEMP_FTP_HOST }}
          FTP_USER: ${{ secrets.INDICE_TEMP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.INDICE_TEMP_FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.INDICE_TEMP_FTP_REMOTE_PATH }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set net:max-retries 4
          set net:reconnect-interval-base 3
          mirror --reverse --verbose --parallel=1 "imgs/flags" "$FTP_REMOTE_PATH/imgs/flags"
          bye
          EOF
